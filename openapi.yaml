components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
  headers:
    X-Units-Charged:
      description: Units this call charged. 0 when it was free or was refunded.
      schema:
        type: integer
    X-Balance-Remaining:
      description: Your balance after the call, in US dollars with four decimals.
      schema:
        type: string
    X-Free-Units-Remaining:
      description: Free units you have left after the call.
      schema:
        type: integer
    X-RateLimit-Limit:
      description: How many requests per second your account may send.
      schema:
        type: integer
    X-RateLimit-Remaining:
      description: Requests left in the current second.
      schema:
        type: integer
    X-Request-Id:
      description: The id of this call. Quote it when you write to support about the call.
      schema:
        type: string
  responses:
    Error401:
      description: "- `unauthorized`: Send a valid API key in the X-Api-Key header."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            type: object
            required:
              - error
              - code
            properties:
              error:
                type: string
                description: A sentence that says what went wrong. The same for every call that fails with this code.
              code:
                type: string
                enum:
                  - unauthorized
                description: The code to test for in your program.
          examples:
            unauthorized:
              summary: unauthorized
              value:
                error: Send a valid API key in the X-Api-Key header.
                code: unauthorized
    Error400:
      description: "- `bad_request`: The request parameters are missing or invalid."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            type: object
            required:
              - error
              - code
            properties:
              error:
                type: string
                description: A sentence that says what went wrong. The same for every call that fails with this code.
              code:
                type: string
                enum:
                  - bad_request
                description: The code to test for in your program.
              fields:
                type: array
                items:
                  type: string
                description: The names of the parameters that were refused.
          examples:
            bad_request:
              summary: bad_request
              value:
                error: The request parameters are missing or invalid.
                code: bad_request
                fields:
                  - username
    Error402:
      description: "- `credits_exhausted`: No credits left. Top up your API balance to continue."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            type: object
            required:
              - error
              - code
            properties:
              error:
                type: string
                description: A sentence that says what went wrong. The same for every call that fails with this code.
              code:
                type: string
                enum:
                  - credits_exhausted
                description: The code to test for in your program.
          examples:
            credits_exhausted:
              summary: credits_exhausted
              value:
                error: No credits left. Top up your API balance to continue.
                code: credits_exhausted
    Error403:
      description: |-
        - `telegram_required`: Link your Telegram account to use the API.
        - `private_account`: This account is private.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            type: object
            required:
              - error
              - code
            properties:
              error:
                type: string
                description: A sentence that says what went wrong. The same for every call that fails with this code.
              code:
                type: string
                enum:
                  - telegram_required
                  - private_account
                description: The code to test for in your program.
              link_url:
                type: string
                format: uri
                description: "Only with telegram_required: the Telegram link that links your account."
          examples:
            telegram_required:
              summary: telegram_required
              value:
                error: Link your Telegram account to use the API.
                code: telegram_required
            private_account:
              summary: private_account
              value:
                error: This account is private.
                code: private_account
    Error404:
      description: |-
        - `not_found`: Nothing was found for this request.
        - `unknown_endpoint`: No such endpoint.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            type: object
            required:
              - error
              - code
            properties:
              error:
                type: string
                description: A sentence that says what went wrong. The same for every call that fails with this code.
              code:
                type: string
                enum:
                  - not_found
                  - unknown_endpoint
                description: The code to test for in your program.
          examples:
            not_found:
              summary: not_found
              value:
                error: Nothing was found for this request.
                code: not_found
            unknown_endpoint:
              summary: unknown_endpoint
              value:
                error: No such endpoint.
                code: unknown_endpoint
    Error429:
      description: "- `rate_limited`: Too many requests. Slow down and retry."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        Retry-After:
          description: Seconds to wait before you try again.
          schema:
            type: integer
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
      content:
        application/json:
          schema:
            type: object
            required:
              - error
              - code
            properties:
              error:
                type: string
                description: A sentence that says what went wrong. The same for every call that fails with this code.
              code:
                type: string
                enum:
                  - rate_limited
                description: The code to test for in your program.
          examples:
            rate_limited:
              summary: rate_limited
              value:
                error: Too many requests. Slow down and retry.
                code: rate_limited
    Error500:
      description: "- `internal_error`: Internal error. Retry shortly."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            type: object
            required:
              - error
              - code
            properties:
              error:
                type: string
                description: A sentence that says what went wrong. The same for every call that fails with this code.
              code:
                type: string
                enum:
                  - internal_error
                description: The code to test for in your program.
          examples:
            internal_error:
              summary: internal_error
              value:
                error: Internal error. Retry shortly.
                code: internal_error
    Error503:
      description: "- `upstream_unavailable`: The call failed on our side and was refunded. Retry shortly."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        Retry-After:
          description: Seconds to wait before you try again, when the source says how long.
          schema:
            type: integer
      content:
        application/json:
          schema:
            type: object
            required:
              - error
              - code
            properties:
              error:
                type: string
                description: A sentence that says what went wrong. The same for every call that fails with this code.
              code:
                type: string
                enum:
                  - upstream_unavailable
                description: The code to test for in your program.
          examples:
            upstream_unavailable:
              summary: upstream_unavailable
              value:
                error: The call failed on our side and was refunded. Retry shortly.
                code: upstream_unavailable
