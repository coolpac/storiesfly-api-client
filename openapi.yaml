# The same document as openapi.json, made from it by `npm run openapi:sync`.
# Do not edit this file: change openapi.json and run the script.
openapi: 3.1.0
info:
  title: StoriesFly API
  version: 1.0.0
  description: |-
    Public Instagram and TikTok data over HTTP: 46 data endpoints for profiles, posts, reels, stories, highlights, comments, followers, hashtags, places and search, TikTok videos without the watermark, profiles, videos, stories, followers, following and reposts, a download endpoint for the files of a post at a fixed low price (x-price), and a free `account` call that shows your balance.

    Send your key in the X-Api-Key header. One API, one key, one balance, two ways a call is priced: a data call costs units at your level's rate (x-units on each operation, 0 for the account call), and an operation with x-price is sold at that fixed price at every level. Free units are spent before your balance; a call with x-price uses one free unit.

    A call that finds nothing, or reaches a private account, is charged. A call that fails on our side is refunded.

    Lists come a page at a time: pass the next_cursor of one page back as cursor to get the next. Page size follows Instagram and varies by endpoint, except where an operation sets x-page-size. On the TikTok operations it follows TikTok.

    Prices and rate limits for each level: https://storiesfly.com/developers/pricing
servers:
  - url: https://storiesfly.com/api/v1
security:
  - ApiKey: []
externalDocs:
  description: Guides and one page for each endpoint
  url: https://storiesfly.com/developers/docs
tags:
  - name: User
  - name: Post
  - name: Stories
  - name: Hashtags
  - name: Places
  - name: Search
  - name: TikTok
  - name: Download
  - name: Other
paths:
  /user/profile:
    get:
      operationId: user_profile
      tags:
        - User
      summary: Profile with verified badge, bio, link and counts
      description: "The public profile of an Instagram account: name, bio, link, follower, following and post counts, and the verified and private flags."
      parameters:
        - name: username
          in: query
          required: false
          description: Instagram username. A leading @ is ignored. Send exactly one of username or id.
          schema:
            type: string
            maxLength: 300
        - name: id
          in: query
          required: false
          description: Numeric Instagram id of the account. Send exactly one of username or id.
          schema:
            type: string
            maxLength: 40
      x-units: 1
      responses:
        "200":
          description: "The answer. The example is a real one, shortened: long lists and texts are cut."
          headers:
            X-Units-Charged:
              $ref: "#/components/headers/X-Units-Charged"
            X-Balance-Remaining:
              $ref: "#/components/headers/X-Balance-Remaining"
            X-Free-Units-Remaining:
              $ref: "#/components/headers/X-Free-Units-Remaining"
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                type: object
              example:
                id: "7719696"
                username: arianagrande
                full_name: Ariana Grande
                bio: petal out now ꕤ ｡˚
                followers: 362337023
                following: 1075
                posts: 599
                verified: true
                is_private: false
